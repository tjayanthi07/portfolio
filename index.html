<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio</title>
<meta name="description" content="">
<style>
:root{--bg:#FBF8F1;--s1:#FFFFFF;--s2:#F4EEDD;--gold:#B8892B;--gold2:#8A6A1F;--gold3:#E0B34A;--goldtx:#8A6A1F;--ghead:#B8892B;--txt:#1B1B1B;--dim:#6F6650;--line:rgba(150,110,30,.30);--grgb:184,137,43;--red:#B5483D;--green:#3E7D5A;--hdr:#FBF8F1;--glass:rgba(255,255,255,.85);--panel:linear-gradient(180deg,rgba(255,255,255,.96),rgba(250,245,232,.92));--card:linear-gradient(180deg,#FFFFFF,#FBF5E6);--shadow:rgba(120,90,20,.14);--leader:#1B1B1B;--artdm:#A59B7E;--spark:rgba(184,137,43,.22);--sans:"Segoe UI","Helvetica Neue",Arial,system-ui,sans-serif;--mono:ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace}
html[data-theme=dark]{--bg:#06060A;--s1:#0D0D13;--s2:#14141C;--gold:#E6B84A;--gold2:#B8892B;--gold3:#FFD97A;--goldtx:#E6B84A;--ghead:#E6B84A;--txt:#F3EEE2;--dim:#A59D88;--line:rgba(var(--grgb),.28);--grgb:230,184,74;--red:#FF6B5E;--green:#6FD3A0;--hdr:#06060A;--glass:var(--glass);--panel:linear-gradient(180deg,rgba(20,20,28,.9),rgba(10,10,16,.9));--card:linear-gradient(180deg,#0F0F17,#08080D);--shadow:rgba(0,0,0,.45);--leader:#FFFFFF;--artdm:#8C8570;--spark:rgba(var(--grgb),.22)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;color:var(--txt);font:16px/1.6 var(--sans);background:radial-gradient(900px 520px at 88% -4%,rgba(var(--grgb),.17),transparent 60%),radial-gradient(700px 520px at -6% 42%,rgba(var(--grgb),.08),transparent 60%),linear-gradient(rgba(var(--grgb),.06) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--grgb),.06) 1px,transparent 1px),var(--bg);background-size:auto,auto,40px 40px,40px 40px,auto;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(380px circle at var(--mx,70%) var(--my,25%),rgba(var(--grgb),.09),transparent 60%)}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main,footer,header{position:relative;z-index:2}header{z-index:25}
section,footer{scroll-margin-top:130px}@media(min-width:981px){section,footer{scroll-margin-top:84px}}
a{color:var(--goldtx)}button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.mono,.eyebrow,.lab{font-family:var(--mono);letter-spacing:.2em;text-transform:uppercase}
#prog{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--gold2),var(--gold3));z-index:30;box-shadow:0 0 12px var(--gold)}
header{position:sticky;top:0;background:var(--hdr);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:16px;padding:12px 24px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--txt)}
.logo .m{width:44px;height:44px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;color:var(--goldtx);font:600 14px var(--mono);box-shadow:0 0 18px rgba(var(--grgb),.3)}
.logo b{display:block;font:700 14px var(--mono);letter-spacing:.22em}.logo small{display:block;font:10px var(--mono);letter-spacing:.3em;color:var(--dim)}
nav{display:flex;gap:16px;flex-wrap:wrap;margin-left:auto}
nav a{font:600 11px var(--mono);letter-spacing:.13em;text-transform:uppercase;text-decoration:none;color:var(--txt);position:relative;padding:6px 0}
nav a::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--gold);box-shadow:0 0 10px var(--gold);transition:width .3s}nav a.on{color:var(--goldtx)}nav a.on::after,nav a:hover::after{width:100%}
.mode{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.mode button{background:none;border:0;padding:8px 11px;font:600 11px var(--mono);letter-spacing:.18em;color:var(--dim)}
.mode button[aria-pressed=true]{background:var(--txt);color:var(--bg)}
section{padding:64px 0 8px}
h1,h2,h3{font-family:var(--sans);font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:0 0 12px}
h2{font-size:clamp(30px,4.4vw,48px)}h2::after{content:"";display:block;height:2px;margin-top:14px;width:0;background:linear-gradient(90deg,var(--gold),transparent);transition:width 1s cubic-bezier(.2,.7,.2,1)}h2.in::after{width:180px}
h3{font-size:24px}
.eyebrow{font-size:12px;color:var(--goldtx);margin-bottom:10px;display:flex;align-items:center;gap:10px}.eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold)}
p{margin:0 0 12px}.lead{max-width:86ch}.dim{color:var(--dim)}
.btn{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(180deg,var(--gold3),var(--gold));color:#0A0A0A;border:0;border-radius:6px;padding:13px 24px;font:700 12px var(--mono);letter-spacing:.2em;text-transform:uppercase;text-decoration:none;box-shadow:0 0 28px rgba(var(--grgb),.3);transition:transform .2s,box-shadow .2s}.btn:hover{transform:translateY(-2px);box-shadow:0 0 40px rgba(var(--grgb),.55)}
.btn.sm{padding:7px 14px;font-size:11px;letter-spacing:.12em}.btn.ghost{background:none;color:var(--txt);border:1px solid var(--line);box-shadow:none}.btn.ghost:hover{border-color:var(--goldtx)}
/* hero */
.hero{position:relative;isolation:isolate;padding-top:36px}
#cluster{position:absolute;inset:0;width:100%;height:100%;z-index:-1;opacity:.8}
.clcap{position:absolute;right:24px;top:10px;font:11px var(--mono);letter-spacing:.1em;color:var(--dim);z-index:1;text-align:right}
.hgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:40px;align-items:center}
.hero h1{font-size:clamp(40px,6.2vw,76px);margin:18px 0 18px}.hero h1 .g{color:var(--ghead);text-shadow:0 0 28px rgba(var(--grgb),.3)}
.w{display:inline-block;opacity:0;transform:translateY(.5em);animation:up .8s cubic-bezier(.2,.7,.2,1) forwards}@keyframes up{to{opacity:1;transform:none}}
.cta{display:flex;gap:14px;flex-wrap:wrap;margin-top:22px}
.term{background:rgba(8,8,12,.92);color:#F3EEE2;border:1px solid var(--gold);border-radius:14px;font:13.5px/1.7 var(--mono);padding:18px 20px;min-height:300px;box-shadow:0 0 40px rgba(var(--grgb),.16),inset 0 0 30px rgba(var(--grgb),.05)}
.term .p{color:var(--goldtx)}.term .o{padding-left:16px;color:#E6DFCF}.term .c{color:var(--gold3)}
.cur{display:inline-block;width:8px;height:15px;background:var(--gold);vertical-align:-2px;animation:b 1s steps(2) infinite}@keyframes b{50%{opacity:0}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:44px}
.stat{border:1px solid var(--line);border-radius:14px;padding:18px;background:var(--glass)}.stat b{display:block;font:800 clamp(38px,5vw,56px)/1.05 var(--sans);color:var(--ghead);text-shadow:0 0 24px rgba(var(--grgb),.25)}.stat span{color:var(--dim);font-size:14px}
.rv{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease,border-color .25s,box-shadow .25s}.rv.in{opacity:1;transform:none}
.fig,.panel{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:20px;box-shadow:0 18px 50px var(--shadow)}
.cap{font:11px var(--mono);letter-spacing:.06em;color:var(--dim);margin-top:10px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.tabs button{background:none;border:1px solid var(--line);border-radius:999px;padding:7px 18px;font:600 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;transition:all .25s}.tabs button:hover{border-color:var(--goldtx);transform:translateY(-2px)}
.tabs button[aria-selected=true]{background:var(--gold);color:#0A0A0A;border-color:var(--goldtx);box-shadow:0 0 22px rgba(var(--grgb),.35)}
.swap{animation:sw .4s ease}@keyframes sw{from{opacity:0;transform:translateX(16px)}}
ul{padding-left:20px;margin:0 0 12px}li{margin-bottom:6px}li::marker{color:var(--goldtx)}
.tag{display:inline-block;font:12px var(--mono);border:1px solid var(--line);border-radius:4px;padding:3px 10px;margin:3px 5px 3px 0;color:var(--dim);animation:tg .45s both;transition:all .2s}.tag:hover{border-color:var(--goldtx);color:var(--goldtx);transform:translateY(-2px)}@keyframes tg{from{opacity:0;transform:scale(.8)}}
/* feature carousel */
.feat{display:grid;grid-template-columns:minmax(0,520px) minmax(0,1fr);gap:44px;align-items:center;margin-top:26px}
.ctrl{display:flex;gap:10px;justify-content:center;align-items:center;margin-bottom:6px}.ctrl .lab{font-size:11px;color:var(--goldtx);margin-right:auto}
.ctrl button{min-width:42px;height:34px;border:1px solid var(--line);background:var(--glass);border-radius:6px;font:600 11px var(--mono);letter-spacing:.2em}.ctrl button:hover{border-color:var(--goldtx);color:var(--goldtx)}.ctrl .auto[aria-pressed=true]{border-color:var(--goldtx);color:var(--goldtx)}
.stage{position:relative;height:540px;perspective:1500px;overflow:hidden;border-radius:18px}
.fcard{position:absolute;left:50%;top:6px;width:min(340px,72%);height:512px;border:2px solid rgba(var(--grgb),.55);border-radius:28px;padding:22px;background:var(--card);box-shadow:0 0 36px rgba(var(--grgb),.14),inset 0 0 40px rgba(var(--grgb),.05);transition:transform .7s cubic-bezier(.2,.7,.2,1),opacity .7s,border-color .4s,box-shadow .4s;display:flex;flex-direction:column;text-align:left;color:inherit;cursor:pointer}
.fcard.on{border-color:var(--goldtx);box-shadow:0 0 60px rgba(var(--grgb),.28),inset 0 0 50px rgba(var(--grgb),.08)}
.fh{display:flex;align-items:center;gap:10px}.fh i{width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 14px var(--gold)}.fh b{font:700 13px var(--mono);letter-spacing:.25em;color:var(--goldtx)}.fh em{margin-left:auto;font:normal 12px var(--mono);border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:rgba(var(--grgb),.06)}
.art{margin:18px 0;border:1px solid var(--line);border-radius:18px;padding:12px;background:rgba(var(--grgb),.03);flex:0 0 auto}.art svg{width:100%;display:block}
.fcard h3{font-size:25px;margin:auto 0 4px;padding-top:12px;border-top:1px solid var(--line)}
.fcard .sub{font:12px/1.5 var(--mono);letter-spacing:.06em;color:var(--dim);margin:0 0 12px}
.ff{display:flex;justify-content:space-between;align-items:center;font:700 13px var(--mono);letter-spacing:.08em;color:var(--goldtx)}.ff span:last-child{font-weight:400;color:var(--dim);letter-spacing:.2em;font-size:11px}
.dots{display:flex;gap:10px;justify-content:center;margin-top:4px}.dots button{width:10px;height:10px;border-radius:999px;border:0;background:rgba(var(--grgb),.3);padding:0;transition:all .4s}.dots button.on{width:44px;background:var(--gold);box-shadow:0 0 14px var(--gold)}
.dhead{display:flex;align-items:center;gap:20px}.bignum{font:800 clamp(70px,9vw,112px)/1 var(--sans);color:var(--ghead);text-shadow:0 0 34px rgba(var(--grgb),.3)}.dhead .lab{border-left:1px solid var(--line);padding-left:18px;font-size:12px;color:var(--goldtx)}.dhead .lab small{display:block;color:var(--dim);font-size:11px;letter-spacing:.14em;margin-top:2px}
.detail{position:relative;z-index:12}.detail h3{font-size:clamp(30px,4vw,46px);margin:14px 0 6px}.detail .sub{font:14px var(--mono);letter-spacing:.08em;color:var(--dim);margin-bottom:18px}
.quote{border-left:2px solid var(--gold);padding:4px 0 4px 22px;margin:0 0 22px;font-size:18px;line-height:1.65;color:var(--txt);max-width:60ch}
.kc{font:700 12px var(--mono);letter-spacing:.2em;color:var(--goldtx);margin:0 0 10px}.kcl{list-style:none;padding:0;margin:0 0 22px}.kcl li{display:flex;gap:12px;align-items:flex-start;margin-bottom:9px}.kcl li::before{content:"✓";flex:0 0 22px;height:22px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-size:12px;color:var(--goldtx);margin-top:2px}
.drawer{margin-top:30px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:start;scroll-margin-top:90px}
.drawer h4{font:700 12px var(--mono);letter-spacing:.2em;color:var(--goldtx);margin:0 0 12px;text-transform:uppercase}
.imp{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
@media(max-width:980px){.feat,.hgrid,.drawer,.cycle{grid-template-columns:1fr!important}.stage{height:520px}nav{display:none}}
/* demos */
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:10px 0}
input[type=range]{accent-color:var(--goldtx);width:min(300px,100%)}
output,.val{font:600 14px var(--mono);color:var(--goldtx)}
.bar{height:10px;background:rgba(var(--grgb),.12);border-radius:3px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;width:0;background:var(--gold);box-shadow:0 0 10px var(--gold);transition:width .2s}
.band{display:inline-block;padding:2px 10px;border-radius:3px;font-weight:700;color:#0A0A0A}
.pillcol{display:flex;flex-direction:column;gap:8px}.pill{border:1px solid var(--line);border-radius:6px;padding:8px 12px;background:var(--s2);text-align:left;transition:all .3s}.pill.on{border-color:var(--goldtx);background:rgba(var(--grgb),.14);box-shadow:0 0 16px rgba(var(--grgb),.2)}.pill.off{opacity:.35}
.apis{display:grid;grid-template-columns:1fr 28px 1fr;align-items:center;gap:6px}.apis .arr{text-align:center;color:var(--goldtx)}
.spark{display:flex;align-items:flex-end;gap:3px;height:110px;margin:10px 0}.spark i{flex:1;background:rgba(var(--grgb),.22);border-radius:2px 2px 0 0;transition:background .2s}
.nodes{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.nd{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font:13px var(--mono);border:2px solid var(--line);background:var(--s2);transition:all .4s}.nd.L{background:var(--gold);color:#0A0A0A;border-color:var(--gold3);box-shadow:0 0 22px rgba(var(--grgb),.6)}.nd.X{border-color:var(--red);color:var(--red);opacity:.5}
/* cycle */
.cycle{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:center}
.cycle svg{width:100%;max-width:700px;margin:0 auto;display:block}
.cn{cursor:pointer}.cn circle{fill:var(--s1);stroke:rgba(var(--grgb),.4);stroke-width:2;transition:all .3s}.cn text{font:600 15px var(--mono);fill:var(--dim);text-anchor:middle;dominant-baseline:central;pointer-events:none}.cn.on circle{fill:var(--gold);stroke:var(--gold3);filter:drop-shadow(0 0 10px var(--gold))}.cn.on text{fill:#0A0A0A}
.cl{font:600 13px var(--mono);letter-spacing:.04em;fill:var(--dim);text-anchor:middle}.cl.on{fill:var(--goldtx)}.cl.s{text-anchor:start}.cl.e{text-anchor:end}
.spin{transform-origin:350px 260px;animation:spin 14s linear infinite;stroke-dasharray:60 1008;filter:drop-shadow(0 0 8px var(--gold))}@keyframes spin{to{transform:rotate(360deg)}}
.cycle .bignum{font-size:72px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}.grid>.fig{transition:transform .25s,border-color .25s,box-shadow .25s}.grid>.fig:hover{transform:translateY(-4px);border-color:var(--goldtx);box-shadow:0 0 34px rgba(var(--grgb),.18)}.grid h3{font-size:19px}
.skim .deep{display:none}
.flow{stroke-dasharray:6 8;animation:fl 1.1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}
.pulse{animation:pu 2.4s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}
details{border:1px solid var(--line);border-radius:14px;margin:14px 0;background:var(--glass);transition:border-color .25s,box-shadow .25s}details:hover,details[open]{border-color:var(--goldtx)}details[open]{box-shadow:0 0 30px rgba(var(--grgb),.12)}
summary{padding:16px 20px;cursor:pointer;font:700 20px var(--sans);list-style:none}
summary::after{content:"+";float:right;font:400 20px var(--mono);color:var(--goldtx)}details[open] summary::after{content:"–"}
details>div{padding:0 20px 20px}details[open]>div{animation:sw .45s ease}
.pc{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px}@media(max-width:980px){.pc{grid-template-columns:1fr}}
video,iframe{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--s2)}iframe{height:460px}
footer{padding:72px 0 56px}footer .panel{text-align:center;padding:44px 24px}footer h2::after{margin-left:auto;margin-right:auto}
html.rmo{scroll-behavior:auto}html.rmo .w,html.rmo .rv{opacity:1!important;transform:none!important;animation:none!important;transition:none!important}html.rmo .flow,html.rmo .pulse,html.rmo .swap,html.rmo .tag,html.rmo .spin,html.rmo .cur,html.rmo details[open]>div{animation:none}html.rmo body::before{display:none}html.rmo h2::after{width:180px}html.rmo .bar i,html.rmo .fcard{transition:none}
.mbtn{background:none;border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:600 10px var(--mono);letter-spacing:.1em;white-space:nowrap;color:var(--dim)}.mbtn:hover{border-color:var(--goldtx);color:var(--goldtx)}
.note{border:1px solid var(--line);border-radius:8px;padding:8px 14px;margin:10px 0;font:12px var(--mono);letter-spacing:.04em;color:var(--dim);background:rgba(var(--grgb),.06)}
.pc.one{grid-template-columns:1fr}
.inds{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:2px 0 4px}.inds .lab{font-size:11px;color:var(--goldtx);margin-right:8px}
.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:14px}
.thumb{position:relative;display:block;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--s2);cursor:zoom-in;aspect-ratio:16/10;transition:transform .3s,border-color .25s,box-shadow .25s}.thumb:hover{transform:translateY(-3px);border-color:var(--goldtx);box-shadow:0 0 28px rgba(var(--grgb),.25)}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top left;display:block;border:0;border-radius:0}
.thumb::after{content:"CLICK TO ENLARGE";position:absolute;right:8px;bottom:8px;font:10px var(--mono);letter-spacing:.14em;background:rgba(6,6,10,.85);color:var(--goldtx);padding:4px 8px;border-radius:4px}
.lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:20px}.lb.on{display:flex}
.lb img{max-width:95vw;max-height:80vh;border:1px solid var(--gold);border-radius:10px;box-shadow:0 0 60px rgba(var(--grgb),.25);background:#000}
.bar2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.frame{margin-top:16px}.fbox iframe{height:620px;border-radius:12px;border:1px solid var(--gold);box-shadow:0 0 40px rgba(var(--grgb),.15)}
</style>
<script>(function(){var q=location.search,os=matchMedia('(prefers-reduced-motion:reduce)').matches,rm=/motion=off/.test(q)||(os&&!/motion=on/.test(q));window.__RM=rm;window.__OSRM=os;if(rm)document.documentElement.classList.add('rmo')})();</script>

<body>
<canvas id="stars" aria-hidden="true"></canvas><div id="prog"></div>

</div></header>

</div><div class="term" id="term" aria-label="Terminal introduction"></div></div>
<div class="stats" id="stats"></div>
</section>

<section id="career"><div class="eyebrow" id="c-eye"></div><h2 id="c-title"></h2><div class="inds" id="inds"></div>
<div class="tabs" id="ctabs" role="tablist"></div><div class="fig" id="cpanel" role="tabpanel"></div></section>
<section id="skills"><div class="eyebrow" id="s-eye"></div><h2 id="s-title"></h2><div class="tabs" id="stabs"></div><div class="fig" id="spanel"></div></section>
<section id="domains">
<div class="eyebrow" id="d-eye"></div><h2 id="d-title"></h2><p class="lead dim" id="d-lead"></p>
<div class="feat">
<div><div class="ctrl"><span class="lab" id="d-slide"></span><button id="d-prev" aria-label="Previous">‹</button><button id="d-auto" class="auto" aria-pressed="true">AUTO</button><button id="d-next" aria-label="Next">›</button></div>
<div class="stage" id="stage"></div><div class="dots" id="dots"></div></div>
<div class="detail" id="detail" aria-live="polite"></div>
</div>
<div class="drawer panel" id="drawer"></div>
</section>
<section id="ai"><div class="eyebrow" id="a-eye"></div><h2 id="a-title"></h2><p class="lead dim" id="a-lead"></p>
<div class="fig cycle"><svg viewBox="0 0 700 520" id="cyc" role="img" aria-label="Delivery cycle"></svg><div id="cpan"></div></div>
<h3 style="margin-top:32px" id="a-tt"></h3><div class="grid" id="aitiles"></div><p class="dim" style="margin-top:14px" id="a-note"></p></section>
<section id="projects"><div class="eyebrow" id="p-eye"></div><h2 id="p-title"></h2><p class="lead dim" id="p-lead"></p><div id="plist"></div></section>
</main>

<footer id="contact"><div class="wrap"><div class="panel"><div class="eyebrow" style="justify-content:center" id="k-eye"></div><h2 id="k-title"></h2><p class="lead dim" style="margin:0 auto 22px" id="k-text"></p><div class="cta" style="justify-content:center" id="k-links"></div></div></div></footer>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Image preview"><img id="lb-i" alt=""><div class="bar2"><button class="btn sm ghost" id="lb-p">‹ Prev</button><span class="cap" id="lb-c"></span><button class="btn sm ghost" id="lb-n">Next ›</button><button class="btn sm" id="lb-x">Close</button></div></div>
<script src="data.js"></script>
<script>
document.documentElement.dataset.theme=(window.PORTFOLIO&&window.PORTFOLIO.theme)||'light';
const P=window.PORTFOLIO,$=s=>document.querySelector(s),rm=window.__RM;const V=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const T=(id,t)=>{const e=$(id);if(e&&t!=null)e.textContent=t};
document.title=P.meta.title;document.querySelector('meta[name=description]').content=P.meta.description||'';
const pr=P.person;$('#mono').textContent=pr.name.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();T('#lname',pr.name.toUpperCase());T('#lrole',pr.tagline);
$('#nav').innerHTML=P.nav.map(n=>`<a href="#${n[0]}">${n[1]}</a>`).join('');
const L=P.labels;['h-eye','d-eye','c-eye','a-eye','p-eye','s-eye','k-eye'].forEach(i=>T('#'+i,L[i]));
T('#h-lead',pr.lead);$('#cta1').textContent=L.cta1;$('#cta2').textContent=L.cta2;
T('#d-title',P.domainsTitle);T('#d-lead',P.domainsLead);T('#c-title',L.careerTitle);T('#a-title',P.aiTitle);T('#a-lead',P.aiLead);T('#a-tt',P.aiTilesTitle);T('#a-note',P.aiNote);T('#p-title',L.projectsTitle);T('#p-lead',P.projectsLead);T('#s-title',L.skillsTitle);T('#k-title',P.contact.title);T('#k-text',P.contact.text);
$('#k-links').innerHTML=P.contact.links.map((l,i)=>`<a class="btn${i?' ghost':''}" href="${l[1]}" ${l[1].startsWith('http')?'target="_blank" rel="noopener"':''}>${l[0]}</a>`).join('')+(P.contact.note?`<p class="dim" style="width:100%;margin:6px 0 0">${P.contact.note}</p>`:'');
$('#stats').innerHTML=P.stats.map(s=>`<div class="stat"><b data-n="${s.n}" data-s="${s.s||''}">0</b><span>${s.l}</span></div>`).join('');
function tabs(id,data,panel,render){const c=$(id);data.forEach((d,i)=>{const b=document.createElement('button');b.textContent=d.k;b.setAttribute('role','tab');b.onclick=()=>sel(i);c.append(b)});function sel(i){[...c.children].forEach((b,j)=>b.setAttribute('aria-selected',i===j));const X=$(panel);X.innerHTML=render(data[i]);X.classList.remove('swap');void X.offsetWidth;X.classList.add('swap')}sel(0)}

/* hero headline + terminal */
$('#h1').innerHTML=pr.headline.split('*').map((seg,k)=>seg.split(' ').filter(Boolean).map(w=>`<span class="w${k%2?' g':''}" data-w>${w}</span>`).join(' ')).join(' ');
document.querySelectorAll('#h1 .w').forEach((e,i)=>e.style.animationDelay=(200+i*80)+'ms');
const tm=$('#term');if(rm){tm.innerHTML=P.terminal.map(l=>`<div><span class="p">$ </span><span class="c">${l[0]}</span></div><div class="o">${l[1].replace(/\n/g,'<br>')}</div>`).join('')}else{let li=0;(function next(){if(li>=P.terminal.length){tm.insertAdjacentHTML('beforeend','<span class="p">$ </span><span class="cur"></span>');return}const l=P.terminal[li++],d=document.createElement('div');d.innerHTML='<span class="p">$ </span><span class="c"></span><span class="cur"></span>';tm.append(d);let i=0;const s=d.querySelector('.c');(function ty(){s.textContent=l[0].slice(0,++i);if(i<l[0].length)setTimeout(ty,40);else{d.querySelector('.cur').remove();const o=document.createElement('div');o.className='o';o.innerHTML=l[1].replace(/\n/g,'<br>');tm.append(o);setTimeout(next,300)}})()})()}
const sk=$('#m-skim'),dp=$('#m-deep');function mode(s){document.body.classList.toggle('skim',s);sk.setAttribute('aria-pressed',s);dp.setAttribute('aria-pressed',!s);if(s)document.querySelectorAll('details').forEach(d=>d.open=false)}
const mb=$('#motion');mb.textContent='MOTION '+(rm?'OFF':'ON');mb.onclick=()=>{location.search=rm?'?motion=on':'?motion=off'};if(window.__OSRM&&rm&&!/motion=/.test(location.search))$('#mnote').innerHTML='<div class="note">Your device asks for reduced motion, so animation is off. <a href="?motion=on">Turn motion on</a></div>';
sk.onclick=()=>mode(true);dp.onclick=()=>{mode(false);document.querySelectorAll('details').forEach(d=>d.open=true)};

/* art library for feature cards */
const G=V('--gold'),G2=V('--goldtx'),DM=V('--artdm'),RED=V('--red'),GREEN=V('--green'),LEAD=V('--leader'),TXT=V('--txt'),GR=a=>'rgba('+V('--grgb')+','+a+')';
const ART={
hub:`<svg viewBox="0 0 300 150"><g fill="none" stroke="${G}" stroke-width="1.5"><rect x="8" y="14" width="64" height="26" rx="4"/><rect x="8" y="62" width="64" height="26" rx="4"/><rect x="8" y="110" width="64" height="26" rx="4"/><rect class="pulse" x="112" y="52" width="70" height="46" rx="6" stroke="${G2}"/><rect x="226" y="52" width="66" height="46" rx="6"/><path class="flow" d="M72 27h18l22 38M72 75h40M72 123h18l22-38M182 75h44" stroke="${DM}"/></g></svg>`,
bars:`<svg viewBox="0 0 300 150"><g fill="${G}">${[50,90,70,120,60,100,80].map((h,i)=>`<rect class="pulse" style="animation-delay:${i*.25}s" x="${18+i*38}" y="${140-h}" width="22" height="${h}" rx="3" opacity=".8"/>`).join('')}</g><path d="M10 140h280" stroke="${DM}"/></svg>`,
spikes:`<svg viewBox="0 0 300 150"><path d="M10 120 40 110 70 118 100 90 130 98 160 60 190 70 220 40 250 52 290 30" fill="none" stroke="${G}" stroke-width="2"/><path d="M10 70h280" stroke="${DM}" stroke-dasharray="5 5"/><g fill="${G2}"><circle class="pulse" cx="150" cy="70" r="5"/><circle class="pulse" cx="206" cy="70" r="5" style="animation-delay:.6s"/></g></svg>`,
curve:`<svg viewBox="0 0 300 150"><path d="M10 130C70 120 120 100 170 70" fill="none" stroke="${G}" stroke-width="2.5"/><path class="flow" d="M170 70C210 48 250 32 290 22" fill="none" stroke="${G2}" stroke-width="2"/><path d="M10 40h280" stroke="${DM}" stroke-dasharray="5 5"/><circle class="pulse" cx="170" cy="70" r="6" fill="${G2}"/></svg>`,
break:`<svg viewBox="0 0 300 150"><path d="M10 90H110M190 90H290" stroke="${G}" stroke-width="2.5"/><path class="flow" d="M110 90H190" stroke="${RED}" stroke-width="2"/><path d="M134 66l32 48M166 66l-32 48" stroke="${RED}" stroke-width="3" class="pulse"/></svg>`,
ring:`<svg viewBox="0 0 300 150"><circle cx="150" cy="75" r="55" fill="none" stroke="${DM}" stroke-dasharray="4 6"/><g fill="${G}">${[0,1,2,3,4,5].map(i=>{const a=i*Math.PI/3-Math.PI/2;return `<circle cx="${150+55*Math.cos(a)}" cy="${75+55*Math.sin(a)}" r="${i?5:8}" ${i?'':`fill="${G2}" class="pulse"`}/>`}).join('')}</g><circle cx="150" cy="75" r="10" fill="none" stroke="${G}"/></svg>`,
loop:`<svg viewBox="0 0 300 150"><circle cx="150" cy="75" r="50" fill="none" stroke="${DM}" stroke-dasharray="4 6"/><circle class="spin2" cx="150" cy="75" r="50" fill="none" stroke="${G}" stroke-width="3" stroke-dasharray="40 275" stroke-linecap="round"/><text x="150" y="80" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" fill="${G}">SPEC</text></svg>`,
grid:`<svg viewBox="0 0 300 150"><g fill="${G}">${Array.from({length:40},(_,i)=>`<circle class="pulse" style="animation-delay:${(i%8)*.2}s" cx="${25+(i%8)*35}" cy="${25+Math.floor(i/8)*25}" r="3"/>`).join('')}</g></svg>`};

/* demos */
const DEMOS={
strategy:{h:d=>{const m=d.dd&&d.dd.modes||['Mode A','Mode B','Mode C'];return `<svg viewBox="0 0 440 200" width="100%" role="img" aria-label="Several modes behind one API"><g fill="none" stroke="${G}" stroke-width="1.5" opacity=".75"><rect x="6" y="14" width="130" height="40" rx="5"/><rect x="6" y="80" width="130" height="40" rx="5"/><rect x="6" y="146" width="130" height="40" rx="5"/><rect class="pulse" x="168" y="62" width="110" height="76" rx="5" stroke="${G2}"/><rect x="310" y="62" width="124" height="76" rx="5"/><path class="flow" d="M136 34h18l14 40M136 100h32M136 166h18l14-40M278 100h32" stroke="${DM}"/></g><g fill="${TXT}" font-family="ui-monospace,monospace" font-size="12"><text x="16" y="38">${m[0]}</text><text x="16" y="104">${m[1]}</text><text x="16" y="170">${m[2]}</text><text x="178" y="96">Strategy</text><text x="178" y="114">per mode</text><text x="320" y="96">${d.dd&&d.dd.out||'One uniform'}</text><text x="320" y="114">${d.dd&&d.dd.out2||'API'}</text></g></svg><div class="cap">callers stay mode-agnostic; new modes do not ripple through the code</div>`}},
api:{h:()=>`<div class="apis"><div class="pillcol" id="ap-c"></div><div class="arr">→</div><div class="pillcol" id="ap-a"></div></div><div id="ap-t" class="val" style="margin-top:12px" role="status"></div><div class="cap">click a consumer to see which APIs serve it</div>`,i(d){const C=d.dd.consumers,A=d.dd.apis,ac=$('#ap-c'),aa=$('#ap-a');A.forEach(a=>{const e=document.createElement('div');e.className='pill';e.textContent=a;aa.append(e)});C.forEach((c,i)=>{const b=document.createElement('button');b.className='pill';b.textContent=c[0];b.onclick=()=>{[...ac.children].forEach((x,j)=>x.classList.toggle('on',i===j));[...aa.children].forEach((x,j)=>{x.classList.toggle('on',c[1].includes(j));x.classList.toggle('off',!c[1].includes(j))});$('#ap-t').textContent=c[2]};ac.append(b)});ac.children[0].click()}},
alert:{h:()=>`<div class="row"><button class="btn sm" id="al-run">Replay a noisy hour</button><span class="dim">usage crossing 70, 85 and 95%</span></div><div class="spark" id="al-s"></div><div id="al-o" class="val" role="status">Press Replay.</div><div class="cap">illustrative thresholds and data. Level-triggered alerts repeat while above a threshold; edge-triggered alerts fire once per crossing.</div>`,i(){const S=[62,64,63,67,70,69,72,75,78,77,80,83,86,84,87,85,83,86,88,86,84,87,89,91,90,88,92,94,93,96,95,97,96,94,96,98],TH=[70,85,95],box=$('#al-s'),out=$('#al-o');box.innerHTML=S.map(v=>`<i style="height:${(v-50)*2}%"></i>`).join('');let t;$('#al-run').onclick=()=>{clearInterval(t);[...box.children].forEach(b=>b.style.background='');let i=0,lv=0,ed=0;out.textContent='Replaying…';t=setInterval(()=>{if(i>=S.length){clearInterval(t);return}const v=S[i],p=i?S[i-1]:0;TH.forEach(x=>{if(v>=x)lv++;if(v>=x&&p<x)ed++});box.children[i].style.background=[V('--spark'),V('--gold3'),V('--gold'),V('--red')][TH.filter(x=>v>=x).length];i++;out.textContent='Level-triggered: '+lv+' notifications · Edge-triggered: '+ed},rm?5:150)}}},
forecast:{h:()=>`<div class="row"><label for="f-used">Used (TB)</label><input id="f-used" type="range" min="100" max="890" value="620"><output id="f-uv"></output></div><div class="row"><label for="f-s">Short-term ingest (TB/day)</label><input id="f-s" type="range" min="1" max="40" value="14"><output id="f-sv"></output></div><div class="row"><label for="f-l">Long-term ingest (TB/day)</label><input id="f-l" type="range" min="1" max="40" value="8"><output id="f-lv"></output></div><div id="f-out" class="val" role="status"></div><div class="cap">illustrative: a 1,000 TB cluster, linear extrapolation of each ingest average</div>`,i(){const fc=()=>{const u=+$('#f-used').value,s=+$('#f-s').value,l=+$('#f-l').value,room=900-u;$('#f-uv').textContent=u+' TB';$('#f-sv').textContent=s;$('#f-lv').textContent=l;const d=x=>room<=0?'already past 90%':Math.round(room/x)+' days';$('#f-out').innerHTML='Short-term: '+d(s)+' · Long-term: '+d(l)};['#f-used','#f-s','#f-l'].forEach(i=>$(i).oninput=fc);fc()}},
login:{h:()=>`<div class="row"><span>Audit write path:</span><button class="btn sm" id="lg-sync" aria-pressed="true">Synchronous</button><button class="btn sm ghost" id="lg-async" aria-pressed="false">Decoupled</button><button class="btn sm ghost" id="lg-run">Run login</button></div><div class="bar"><i id="lg-bar"></i></div><div id="lg-out" class="val" role="status">Press Run login.</div><div class="cap">illustrative timing, not production data. Client timeout is 5 s; the degraded audit store never answers.</div>`,i(){const A=$('#lg-sync'),B=$('#lg-async');let as=false,t;const setm=a=>{as=a;A.className='btn sm'+(a?' ghost':'');B.className='btn sm'+(a?'':' ghost');A.setAttribute('aria-pressed',!a);B.setAttribute('aria-pressed',a)};A.onclick=()=>setm(false);B.onclick=()=>setm(true);
$('#lg-run').onclick=()=>{clearInterval(t);const bar=$('#lg-bar'),out=$('#lg-out');let x=0;bar.style.width='0';bar.style.background=as?GREEN:G;out.textContent='Authenticating…';
if(as){setTimeout(()=>{bar.style.width='100%';out.textContent='Logged in after 0.02 s. Audit event queued for the isolated store.'},rm?0:400);return}
t=setInterval(()=>{x+=rm?.3:.06;const s=Math.min(x,5);bar.style.width=(s/5*100)+'%';if(s>=5){clearInterval(t);bar.style.background=RED;out.textContent='Client timed out at 5 s. Login succeeded, but the response was blocked by the audit write.'}else out.textContent='Auth OK. Waiting on audit write… '+s.toFixed(1)+' s'},60)}}},
election:{h:()=>`<div class="nodes" id="el-n"></div><div class="row"><button class="btn sm" id="el-k">Fail the leader</button><button class="btn sm ghost" id="el-r">Restore all</button></div><div id="el-o" class="val" role="status"></div><div class="cap">illustrative: only the leader runs periodic cluster work, followers stay warm for failover</div>`,i(){const al=[1,1,1,1,1];let Ld=0;const n=$('#el-n'),o=$('#el-o');const draw=m=>{n.innerHTML=al.map((a,i)=>`<div class="nd ${!a?'X':i===Ld?'L':''}">n${i}</div>`).join('');o.textContent=m||'Periodic job runs on n'+Ld+' only'};$('#el-k').onclick=()=>{al[Ld]=0;draw('Leader failed. Electing…');setTimeout(()=>{const nx=al.indexOf(1);if(nx<0){o.textContent='No nodes alive';return}Ld=nx;draw('n'+Ld+' elected. Periodic job runs on n'+Ld+' only')},rm?0:900)};$('#el-r').onclick=()=>{al.fill(1);if(!al[Ld])Ld=0;draw()};draw()}},
link:{h:d=>`<p>${d.dd.text}</p><a class="btn sm" href="${d.dd.href}">${d.dd.label}</a>`},
pace:{h:()=>`<div class="row"><label for="p-t">Time of day</label><input id="p-t" type="range" min="9" max="18" step="0.25" value="15"><output id="p-tv"></output></div><div id="p-rows"></div><div id="p-out" role="status"></div><div class="cap">pace = actual ÷ expected so far, capped at 100%. Expected so far = planned minutes × share of the 9:00–18:00 day elapsed. Overall pace = weighted sum of the paces. Red at 50% or below, green at 85% or above. At 9:00 nothing is due yet, so every pace starts at 100%.</div>`,i(d){const ACT=d&&d.acts||[['Activity A',55,90,.5],['Activity B',20,60,.3],['Activity C',25,30,.2]];
$('#p-rows').innerHTML=ACT.map((a,k)=>`<div style="margin:12px 0"><div class="row" style="margin:0"><b>${a[0]}</b><span class="dim">weight ${Math.round(a[3]*100)}% · planned ${a[2]} min</span></div><div class="row" style="margin:2px 0"><label for="p-a${k}">Done so far</label><input id="p-a${k}" type="range" min="0" max="${Math.round(a[2]*1.2)}" value="${a[1]}"><output id="p-av${k}"></output></div><div class="bar"><i id="p-b${k}"></i></div><div class="cap" id="p-c${k}" style="margin-top:2px"></div></div>`).join('');
const pc=()=>{const h=+$('#p-t').value,E=(h-9)/9,hh=Math.floor(h),mm=Math.round((h-hh)*60);$('#p-tv').textContent=String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');let tot=0;const parts=[];ACT.forEach((a,k)=>{const act=+$('#p-a'+k).value,ex=a[2]*E,p=ex===0?1:Math.min(1,act/ex),pts=Math.round(a[3]*p*1000)/10;tot+=pts;parts.push(Math.round(a[3]*100)+'% × '+Math.round(p*100)+'%');$('#p-av'+k).textContent=act+' min';$('#p-b'+k).style.width=(p*100)+'%';$('#p-c'+k).textContent='expected by now '+Math.round(ex)+' min · pace '+Math.round(p*100)+'% · adds '+pts.toFixed(1)+' points'});
const s2=Math.round(tot*10)/10,b=s2<=50?['Red','#FF8A7E']:s2>=85?['Green','#6FD3A0']:['Yellow','#FFD97A'];$('#p-out').innerHTML='<div class="cap" style="margin:0 0 6px">'+parts.join(' + ')+'</div><div class="val">Overall pace '+s2.toFixed(1)+'% <span class="band" style="background:'+b[1]+'">'+b[0]+'</span></div>'};
document.querySelectorAll('#p-t,#p-rows input').forEach(e=>e.oninput=pc);pc()}}};

/* feature carousel */
const dom=P.domains,N=dom.length,stage=$('#stage'),dotsEl=$('#dots'),cards=[];let cur=0,auto=!rm,paused=false,timer;
dom.forEach((d,i)=>{const c=document.createElement('button');c.className='fcard';c.setAttribute('aria-label',d.title);c.innerHTML=`<div class="fh"><i></i><b>${P.labels.feature} ${String(i+1).padStart(2,'0')}</b><em>${d.tag}</em></div><div class="art">${ART[d.art]||ART.grid}</div><h3>${d.title}</h3><p class="sub">${d.sub}</p><div class="ff"><span>${P.labels.explore} →</span><span>${d.code}</span></div>`;c.onclick=()=>go(i);stage.append(c);cards.push(c);const b=document.createElement('button');b.setAttribute('aria-label',d.title);b.onclick=()=>go(i);dotsEl.append(b)});
function place(){cards.forEach((c,i)=>{let o=i-cur;if(o>N/2)o-=N;if(o<-N/2)o+=N;const a=Math.abs(o);c.style.transform=`translateX(-50%) translateX(${o*56}%) translateZ(${-a*150}px) rotateY(${-o*36}deg) scale(${1-a*.08})`;c.style.opacity=a>2?0:1-a*.3;c.style.zIndex=10-a;c.style.pointerEvents=a>2?'none':'auto';c.classList.toggle('on',o===0);c.tabIndex=o===0?0:-1});[...dotsEl.children].forEach((b,i)=>b.classList.toggle('on',i===cur));T('#d-slide',P.labels.slide+' ['+(cur+1)+'/'+N+']')}
function detail(){const d=dom[cur];$('#detail').innerHTML=`<div class="dhead"><div class="bignum">${String(cur+1).padStart(2,'0')}</div><div class="lab">${d.tag}<small>${d.code}</small></div></div><h3>${d.title}</h3><div class="sub">${d.sub}</div><div class="quote">${d.lead}</div><div class="kc">${P.labels.key}</div><ul class="kcl">${d.key.map(k=>`<li>${k}</li>`).join('')}</ul><a class="btn" href="#drawer" id="dcta">${P.labels.demo} →</a>`;
const dr=$('#drawer');dr.innerHTML=`<div><h4>${P.labels.all}</h4><ul class="deep">${d.w.map(x=>`<li>${x}</li>`).join('')}</ul><div class="deep">${d.c.map((x,k)=>`<span class="tag" style="animation-delay:${k*45}ms">${x}</span>`).join('')}</div><p class="imp"><b>${P.labels.impact}.</b> ${d.i}</p></div>${DEMOS[d.demo]?`<div class="fig"><h4>${P.labels.illus||'Interactive illustration'}</h4>${DEMOS[d.demo].h(d)}</div>`:'<div></div>'}`;DEMOS[d.demo]&&DEMOS[d.demo].i&&DEMOS[d.demo].i(d);
['#detail','#drawer'].forEach(s=>{const e=$(s);e.classList.remove('swap');void e.offsetWidth;e.classList.add('swap')});$('#dcta').onclick=e=>{e.preventDefault();$('#drawer').scrollIntoView({behavior:rm?'auto':'smooth',block:'start'})}}
function go(i,user=true){cur=(i+N)%N;place();detail();if(user)restart()}
function restart(){clearInterval(timer);if(auto)timer=setInterval(()=>{if(!paused)go(cur+1,false)},6500)}
$('#d-prev').onclick=()=>go(cur-1);$('#d-next').onclick=()=>go(cur+1);$('#d-auto').onclick=e=>{auto=!auto;e.currentTarget.setAttribute('aria-pressed',auto);restart()};
['stage','drawer'].forEach(i=>{const e=$('#'+i);e.addEventListener('mouseenter',()=>paused=true);e.addEventListener('mouseleave',()=>paused=false);e.addEventListener('focusin',()=>paused=true);e.addEventListener('focusout',()=>paused=false)});
$('#domains').addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(cur-1);if(e.key==='ArrowRight')go(cur+1)});
let sx=null;stage.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});stage.addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>40)go(cur+(dx<0?1:-1));sx=null});
place();detail();restart();$('#d-auto').setAttribute('aria-pressed',auto);
new IntersectionObserver(e=>{paused=!e[0].isIntersecting}).observe($('#domains'));
let wl=0;stage.addEventListener('wheel',e=>{const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;if(Math.abs(d)<8)return;e.preventDefault();const t=Date.now();if(t-wl<650)return;wl=t;go(cur+(d>0?1:-1))},{passive:false});

/* delivery cycle */
const ST=P.stages;
(function(){const s=$('#cyc');let h='<circle cx="350" cy="260" r="170" fill="none" stroke="'+GR(.35)+'" stroke-width="2" stroke-dasharray="4 8"/><circle class="spin" cx="350" cy="260" r="170" fill="none" stroke="'+G+'" stroke-width="4" stroke-linecap="round"/><text x="350" y="250" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-weight="800" font-size="22" fill="'+TXT+'">'+P.cycleCenter[0]+'</text><text x="350" y="278" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-weight="800" font-size="22" fill="'+G2+'">'+P.cycleCenter[1]+'</text>';
const K=ST.length;ST.forEach((t,i)=>{const a=-Math.PI/2+i*2*Math.PI/K,c=Math.cos(a),x=350+170*c,y=260+170*Math.sin(a),side=c>.3?1:c<-.3?-1:0,lx=x+side*36,ly=side?y+5:(Math.sin(a)<0?y-40:y+50);h+=`<g class="cn" data-i="${i}" tabindex="0" role="button" aria-label="${t[0]}"><circle cx="${x}" cy="${y}" r="26"/><text x="${x}" y="${y}">${i+1}</text></g><text class="cl ${side>0?'s':side<0?'e':''}" data-l="${i}" x="${lx}" y="${ly}">${t[0]}</text>`});s.innerHTML=h;
let cu=0,at=null;function g(i){cu=i;s.querySelectorAll('.cn').forEach(e=>e.classList.toggle('on',+e.dataset.i===i));s.querySelectorAll('.cl').forEach(e=>e.classList.toggle('on',+e.dataset.l===i));const t=ST[i],X=$('#cpan');X.innerHTML=`<div class="bignum">${String(i+1).padStart(2,'0')}</div><h3>${t[0]}</h3><p><b class="mono" style="font-size:12px;color:var(--goldtx)">${P.labels.ai}</b><br>${t[1]}</p><p><b class="mono" style="font-size:12px;color:var(--goldtx)">${P.labels.me}</b><br>${t[2]}</p><p class="dim">${P.labels.gate}</p>`;X.classList.remove('swap');void X.offsetWidth;X.classList.add('swap')}
s.querySelectorAll('.cn').forEach(e=>{e.onclick=()=>{clearInterval(at);g(+e.dataset.i)};e.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();e.click()}}});g(0);
if(!rm)new IntersectionObserver(e=>{clearInterval(at);if(e[0].isIntersecting)at=setInterval(()=>g((cu+1)%K),3200)}).observe(s)})();
$('#aitiles').innerHTML=P.tiles.map(t=>`<div class="fig"><h3>${t[0]}</h3><p>${t[1]}</p></div>`).join('');

/* career, skills, projects */
if(P.industries&&P.industries.length)$('#inds').innerHTML='<span class="lab">'+(L.inds||'Industries')+'</span>'+P.industries.map(x=>'<span class="tag">'+x+'</span>').join('');
tabs('#ctabs',P.career,'#cpanel',d=>`<h3>${d.k}</h3><div class="dim mono" style="font-size:12px">${d.d} · ${d.r}</div><ul style="margin-top:14px">${d.p.map(x=>`<li>${x}</li>`).join('')}</ul>`);
tabs('#stabs',P.skills,'#spanel',d=>d.v.map((x,i)=>`<span class="tag" style="animation-delay:${i*45}ms">${x}</span>`).join(''));
window.__LB=[];
$('#plist').innerHTML=P.projects.map((p,i)=>{const med=p.media||[],imgs=med.filter(x=>x.kind==='img'),vids=med.filter(x=>x.kind==='video'),fr=med.find(x=>x.kind==='frame');window.__LB[i]=imgs;
const iH=imgs.length?(p.shotsNote?`<div class="cap" style="margin-top:14px">${p.shotsNote}</div>`:'')+`<div class="shots">${imgs.map((x,k)=>`<button class="thumb" data-lb="${i}:${k}" aria-label="Enlarge: ${x.alt||'screenshot'}"><img src="${x.src}" alt="${x.alt||''}" loading="lazy"></button>`).join('')}</div>`:'';
const vH=vids.length?`<div class="grid" style="margin-top:14px">${vids.map(x=>`<figure style="margin:0"><video controls preload="metadata" playsinline><source src="${x.src}" type="video/mp4">Add ${x.src} next to this page.</video><figcaption class="cap">${x.cap||''}</figcaption></figure>`).join('')}</div>`:'';
const fH=fr?`<div class="frame"><div class="row"><button class="btn sm" data-frame="${fr.src}">${fr.label||'Load live preview'}</button><a href="${fr.src}" target="_blank" rel="noopener">Open in a new tab</a></div><div class="fbox"></div></div>`:'';
return `<details${p.open?' open':''}><summary>${p.title}</summary><div><div class="pc${p.figHtml?'':' one'}"><div><p>${p.body}</p>${p.bullets?`<ul class="deep">${p.bullets.map(b=>`<li>${b}</li>`).join('')}</ul>`:''}${p.demo?`<div class="fig" id="pd-${i}">${DEMOS[p.demo].h(p)}</div>`:''}</div>${p.figHtml?`<div class="fig">${p.figHtml}</div>`:''}</div>${iH}${vH}${fH}</div></details>`}).join('');
P.projects.forEach(p=>{if(p.demo&&DEMOS[p.demo].i)DEMOS[p.demo].i(p)});
document.querySelectorAll('[data-frame]').forEach(b=>b.onclick=()=>{b.closest('.frame').querySelector('.fbox').innerHTML=`<iframe src="${b.dataset.frame}" title="Live preview" loading="lazy"></iframe>`;b.remove()});
let lbS=[],lbK=0;const lb=$('#lb');const lbShow=()=>{const x=lbS[lbK];$('#lb-i').src=x.src;$('#lb-i').alt=x.alt||'';$('#lb-c').textContent=(lbK+1)+' / '+lbS.length+(x.alt?' · '+x.alt:'')};
document.querySelectorAll('[data-lb]').forEach(b=>b.onclick=()=>{const q=b.dataset.lb.split(':').map(Number);lbS=window.__LB[q[0]];lbK=q[1];lbShow();lb.classList.add('on');$('#lb-x').focus()});
const lbClose=()=>lb.classList.remove('on');$('#lb-x').onclick=lbClose;lb.onclick=e=>{if(e.target===lb)lbClose()};$('#lb-p').onclick=()=>{lbK=(lbK-1+lbS.length)%lbS.length;lbShow()};$('#lb-n').onclick=()=>{lbK=(lbK+1)%lbS.length;lbShow()};
addEventListener('keydown',e=>{if(!lb.classList.contains('on'))return;if(e.key==='Escape')lbClose();if(e.key==='ArrowLeft')$('#lb-p').click();if(e.key==='ArrowRight')$('#lb-n').click()});

/* starfield + hero cluster */
(function(){const cv=$('#stars');if(P.theme!=='dark'){cv.remove();return}const x=cv.getContext('2d'),dpr=Math.min(2,devicePixelRatio||1);let W,H,S=[],sh=null,mx=0,my=0,last=0;
const size=()=>{W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);S=Array.from({length:Math.round(W*H/9000)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.3,z:Math.random(),ph:Math.random()*6.28,g:Math.random()<.35}))};
function draw(t){const dt=Math.min(40,t-last||16);last=t;x.clearRect(0,0,W,H);S.forEach(s=>{s.y-=dt*.004*(s.z+.2);if(s.y<-2)s.y=H+2;const px=s.x+mx*s.z*26,py=s.y+my*s.z*26,a=.35+.65*Math.abs(Math.sin(t*.0007*(1+s.z)+s.ph));x.globalAlpha=a*(.4+s.z*.6);x.fillStyle=s.g?'#E6B84A':'#F3EEE2';x.beginPath();x.arc(px,py,s.r,0,7);x.fill()});x.globalAlpha=1;
if(!sh&&Math.random()<.004)sh={x:Math.random()*W,y:Math.random()*H*.5,l:0};if(sh){sh.l+=dt*.6;const g=x.createLinearGradient(sh.x,sh.y,sh.x-sh.l,sh.y-sh.l*.4);g.addColorStop(0,'rgba(255,217,122,.9)');g.addColorStop(1,'transparent');x.strokeStyle=g;x.lineWidth=1.5;x.beginPath();x.moveTo(sh.x,sh.y);x.lineTo(sh.x-sh.l,sh.y-sh.l*.4);x.stroke();sh.x+=dt*.9;sh.y+=dt*.36;if(sh.l>160)sh=null}
if(!rm)requestAnimationFrame(draw)}
size();addEventListener('resize',size);addEventListener('pointermove',e=>{mx=e.clientX/W-.5;my=e.clientY/H-.5},{passive:true});requestAnimationFrame(draw)})();
(function(){const cv=$('#cluster'),cap=$('#cl-cap'),x=cv.getContext('2d'),N=30,dpr=Math.min(2,devicePixelRatio||1);let W,H,ns=[],mx=-999,my=-999,leader=0,elect=0,run=false,nextKill=3000,last=0;
const size=()=>{const r=cv.parentElement.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)};
const init=()=>{ns=Array.from({length:N},(_,i)=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,on:1,a:1,id:i,back:0}))};
const alive=()=>ns.filter(n=>n.on);const text=()=>cap.textContent='illustrative cluster: '+alive().length+'/'+N+' nodes · '+(elect?'electing leader…':'leader n'+leader);
function tick(t){const dt=Math.min(40,t-last||16);last=t;
if(t>nextKill){const a=alive(),v=a[Math.floor(Math.random()*a.length)];v.on=0;v.back=t+3500;if(v.id===leader)elect=t+1400;nextKill=t+5000}
ns.forEach(n=>{if(!n.on&&t>n.back)n.on=1});if(elect&&t>elect){elect=0;const a=alive();leader=a.length?a[0].id:0}
x.clearRect(0,0,W,H);
ns.forEach(n=>{n.a+=((n.on?1:0)-n.a)*.08;n.x+=n.vx*dt*.18;n.y+=n.vy*dt*.18;if(n.x<0||n.x>W)n.vx*=-1;if(n.y<0||n.y>H)n.vy*=-1;const dx=n.x-mx,dy=n.y-my,d=Math.hypot(dx,dy);if(d<130&&d>1){n.x+=dx/d*1.2;n.y+=dy/d*1.2}});
for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){const a=ns[i],b=ns[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<190){const al=(1-d/190)*.5*Math.min(a.a,b.a);if(al>.01){x.strokeStyle=GR(al);x.lineWidth=1;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}}
ns.forEach(n=>{const d=Math.hypot(n.x-mx,n.y-my);if(d<150&&n.on){x.strokeStyle=GR((1-d/150)*.8);x.beginPath();x.moveTo(mx,my);x.lineTo(n.x,n.y);x.stroke()}
const L=n.id===leader&&!elect&&n.on;x.fillStyle=n.on?(L?LEAD:G):RED;x.globalAlpha=Math.max(.2,n.a);x.shadowColor=L?G:'transparent';x.shadowBlur=L?14:0;x.beginPath();x.arc(n.x,n.y,L?5.5:3.2,0,7);x.fill();x.shadowBlur=0;
if(L){x.globalAlpha=.6*(1-(t%1800)/1800);x.strokeStyle=G;x.beginPath();x.arc(n.x,n.y,5+(t%1800)/1800*22,0,7);x.stroke()}
if(!n.on){x.globalAlpha=.8;x.strokeStyle=RED;x.beginPath();x.arc(n.x,n.y,6,0,7);x.stroke()}x.globalAlpha=1});
text();if(run)requestAnimationFrame(tick)}
size();init();text();if(rm){tick(0);return}
addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top},{passive:true});addEventListener('resize',()=>{size();init()});
new IntersectionObserver(e=>{const v=e[0].isIntersecting;if(v&&!run){run=true;requestAnimationFrame(tick)}else if(!v)run=false}).observe(cv.parentElement)})();

/* page motion */
addEventListener('scroll',()=>{const h=document.documentElement;$('#prog').style.width=(scrollY/(h.scrollHeight-innerHeight)*100)+'%'},{passive:true});
addEventListener('pointermove',e=>{document.body.style.setProperty('--mx',e.clientX+'px');document.body.style.setProperty('--my',e.clientY+'px')},{passive:true});
const rvEls=document.querySelectorAll('.fig,details,.stat,.thumb,section>p,.panel');rvEls.forEach(e=>e.classList.add('rv'));
const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){const e=en.target;e.style.transitionDelay=(e.dataset.d||0)+'ms';e.classList.add('in');io.unobserve(e)}}),{threshold:.06});
rvEls.forEach(e=>{const pc=e.parentElement.classList;e.dataset.d=pc.contains('grid')||pc.contains('stats')||pc.contains('shots')?[...e.parentElement.children].indexOf(e)*90:0;io.observe(e)});
document.querySelectorAll('h2').forEach(h=>io.observe(h));
const cnt=new IntersectionObserver(es=>es.forEach(en=>{if(!en.isIntersecting)return;const b=en.target,n=+b.dataset.n,sfx=b.dataset.s||'';cnt.unobserve(b);if(rm){b.textContent=n+sfx;return}const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/1400),e=1-Math.pow(1-k,3);b.textContent=Math.round(n*e)+(k===1?sfx:'');if(k<1)requestAnimationFrame(f)})(t0)}),{threshold:.6});
document.querySelectorAll('.stat b').forEach(b=>cnt.observe(b));
const links=[...document.querySelectorAll('nav a')];const spy=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting)links.forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+en.target.id))}),{rootMargin:'-45% 0px -50% 0px'});
document.querySelectorAll('main section[id],footer[id]').forEach(e=>spy.observe(e));
</script>
</body>
</html>
